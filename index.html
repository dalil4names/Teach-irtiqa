<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ارتقاء - المعلم</title>
<meta name="theme-color" content="#0b4a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="jszip.min.js"></script>
<style>
:root{--g9:#073b30;--g8:#0b4a3d;--g7:#0f6a56;--g5:#1c9378;--gold:#c9a24a;--gold2:#e8c468;--bg:#f5f0e4;--card:#fffdf8;--ink:#1d2b27;--mut:#76827d;--line:#e6dfcd;--soft:#efe8d6;--red:#c4453b;--sh:0 10px 28px -14px rgba(7,59,48,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh;
background-image:radial-gradient(circle at 100% 0,rgba(201,162,74,.12),transparent 40%),radial-gradient(circle at 0 100%,rgba(15,106,86,.10),transparent 45%)}
button,input,select,textarea{font:inherit;color:inherit}
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(135deg,var(--g9),var(--g7) 70%,var(--g5));border-radius:0 0 22px 22px;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:0;opacity:.14;background:
 repeating-conic-gradient(from 0deg at 50% 50%,#fff 0 6deg,transparent 6deg 30deg);mask:radial-gradient(circle at 12% 30%,#000,transparent 55%);-webkit-mask:radial-gradient(circle at 12% 30%,#000,transparent 55%)}
.hero>*{position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.3);flex:none}
.brand b{font-size:16.5px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{font-size:12px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand>div{flex:1;min-width:0}.hsel{flex:none;max-width:46%;width:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 10px;font-weight:700;font-size:13px}.hsel option{color:#1d2b27}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sub{color:var(--mut);font-size:13px;line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--g8),var(--g5));color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(15,106,86,.7)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2c07;border-color:transparent}
.btn.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.arm{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g5);box-shadow:0 0 0 3px rgba(28,147,120,.18)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:18px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1 0 auto;min-width:54px;border:0;background:transparent;border-radius:14px;padding:7px 6px;cursor:pointer;line-height:1.15}
.seg button small{display:block;font-size:11px;color:var(--mut)}.seg button b{font-size:18px}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--g8),var(--g5));color:#fff;box-shadow:0 6px 16px -6px rgba(7,59,48,.6)}
.seg button[aria-pressed=true] small{color:#d7efe8}
.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:8px;transition:width .3s}
.stu{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:12px;margin-bottom:12px}
.stu.done{border-color:color-mix(in srgb,var(--g5) 45%,var(--line))}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;font-size:13px;color:var(--g8)}
.stu.done .num{background:var(--g7);color:#fff}
.nm{flex:1;min-width:0;font-weight:800;font-size:15.5px;line-height:1.35}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,#fff);color:#6b5110;font-size:12px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
.tot{flex:none;text-align:center;background:linear-gradient(135deg,var(--g9),var(--g7));color:#fff;border-radius:14px;padding:5px 10px;min-width:62px}
.tot small{display:block;font-size:10px;opacity:.8}.tot b{font-size:17px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fl{background:var(--soft);border-radius:15px;padding:6px 5px 7px;text-align:center}
.fl label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px;font-weight:700}
.st{display:flex;align-items:center;gap:3px;direction:ltr}
.st button{flex:none;width:27px;height:34px;border:0;border-radius:10px;background:#fff;font-size:18px;font-weight:800;color:var(--g7);cursor:pointer;box-shadow:0 1px 0 var(--line)}
.st button:active{background:var(--g7);color:#fff}
.st input{padding:6px 2px;text-align:center;font-weight:800;font-size:15px;border-radius:10px;border-width:1px}
.nav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:auto;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 34px -10px rgba(7,59,48,.45);display:flex;padding:6px;z-index:5}
.nav button{flex:1;border:0;background:transparent;border-radius:20px;padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11.5px;font-weight:700;position:relative}
.nav button[aria-current=page]{background:linear-gradient(135deg,var(--g8),var(--g5));color:#fff}
.nav button[aria-current=page]::after{content:"";position:absolute;bottom:3px;width:16px;height:3px;border-radius:3px;background:var(--gold2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--g8);font-size:12px;position:sticky;top:0}
td.n,th.n{text-align:right;position:sticky;inset-inline-start:0;background:var(--card);font-weight:700}th.n{background:var(--soft)}
.scroll{overflow-x:auto;border-radius:14px}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:800}
.rk.r1{background:var(--gold2);color:#3a2c07}.rk.r2{background:#dfe5e2}.rk.r3{background:#e9c9a6}
.empty{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.9}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.srow .nmi{grid-column:1/-1;display:flex;gap:8px}
.srow .nmi input{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#10251f;color:#fff;padding:11px 18px;border-radius:16px;z-index:50;font-size:14px;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(7,25,20,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;width:100%;margin:0;max-height:90vh;overflow:auto}
.updb{position:relative;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--g7);display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;margin-inline-start:6px}
.updb.has::after{content:"";position:absolute;top:-2px;inset-inline-end:-2px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.updb.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.vers{text-align:center;color:var(--mut);font-size:12.5px;margin:18px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:12.5px;margin-top:10px}
.mon{display:flex;gap:8px;align-items:center}.mon select{flex:1;font-weight:800}
.stu{padding:0;overflow:hidden}
.stu .sh{margin:0;padding:12px;cursor:pointer;width:100%;background:none;border:0;text-align:right}
.stu .body{padding:0 12px 12px;border-top:1px dashed var(--line);padding-top:10px}
.chev{flex:none;color:var(--mut);transition:transform .2s}.stu.open .chev{transform:rotate(180deg)}
.sm2{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.hl{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}.hl input{flex:1 1 130px}
</style>
</head>

const KEY='muallim-v1',MAXS=35,VER='4';
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0},rnd=v=>Math.round((+v+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const nname=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();

const ico=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const DEF_PATHS=[['أ','ابتدائي'],['ث','ثانوي'],['ج','جامعي'],['س','متوسط'],['ش','شموخ'],['ص','صفوف أولى'],['ع','معالي'],['ه','مهرة',{nolevel:1}],['و','سمو'],['ك','كبار',{big:1}],['م','مبدعين']].map(([code,name,o])=>({code,name,...(o||{})}));
const DEF_LEVELS=[{code:'ذ',name:'ذهبي'},{code:'ف',name:'فضي'},{code:'ب',name:'برونزي'}];
const FLD=[['hifz','الحفظ',.5],['rev','المراجعة',.5],['les','الدروس',10],['int','التفاعل',50],['exam','الاختبار',1],['track','المضمار',1]];
const curMon=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const monTxt=m=>{const [y,mo]=m.split('-');return (+mo)+' / '+y};
const nextMon=m=>{let [y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')};
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const newH=(name,sup)=>({id:uid(),name:name||'',sup:sup||'',students:[],entries:{}});
function load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(x&&x.students&&!x.halaqat){const h=newH(x.halaqa,x.sup);h.students=x.students;h.entries=x.entries||{};x.halaqat=[h];x.cur=h.id;delete x.students;delete x.entries;delete x.halaqa;delete x.sup}
  if(x&&x.halaqat&&x.halaqat.length)return x;
  const h=newH();return{setup:false,teacher:'',halaqat:[h],cur:h.id,paths:DEF_PATHS,levels:DEF_LEVELS,mon:curMon(),months:[curMon()],wk:1,def:{p:'أ',l:'ذ'}}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ: المساحة ممتلئة')}};
const H=()=>S.halaqat.find(h=>h.id===S.cur)||S.halaqat[0];
let ui={tab:'marks',confirm:'',upd:false,busy:false,open:''};
const pOf=c=>S.paths.find(p=>p.code===c)||{code:c,name:c},noLvl=c=>!!pOf(c).nolevel,isBig=c=>!!pOf(c).big;
const gKey=s=>noLvl(s.path)||!s.level?s.path:s.path+'.'+s.level;
const wkKey=(m,w)=>m+':w'+w,entH=(h,m,w,sid)=>((h.entries[wkKey(m,w)]||{})[sid])||{},ent=(m,w,sid)=>entH(H(),m,w,sid);
const pts=(e,big)=>rnd(num(e.hifz)*100+num(e.rev)*30+num(e.les)+(big?0:num(e.int))+num(e.exam)*1000);
const hasData=e=>FLD.some(([k])=>e[k]!==undefined&&e[k]!=='');
function agg(s,m){const r={hifz:0,rev:0,les:0,int:0,exam:0,track:0};for(let w=1;w<=5;w++){const e=ent(m,w,s.id);['hifz','rev','les','int','exam'].forEach(k=>r[k]+=num(e[k]));r.track=Math.max(r.track,num(e.track))}
  Object.keys(r).forEach(k=>r[k]=rnd(r[k]));if(isBig(s.path))r.int=0;r.total=pts(r,isBig(s.path));return r}
let tt;function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3000)}
function ask(k){if(ui.confirm===k){ui.confirm='';return true}ui.confirm=k;render();setTimeout(()=>{if(ui.confirm===k){ui.confirm='';render()}},4000);return false}
function box(title,body,btns){return new Promise(res=>{const o=document.createElement('div');o.className='modal';o.innerHTML=`<div class="card"><h2>${esc(title)}</h2>${body}<div class="row" style="margin-top:14px">${btns}</div></div>`;document.body.appendChild(o);res(o)})}

/* ---------- الشاشات ---------- */
function hero(){const hs=S.halaqat;
  return `<div class="hero"><div class="brand"><img src="icon-192.png" alt=""><div><b>${esc(H().name||'حلقتي')}</b><span>المعلم: ${esc(S.teacher||'—')}${H().sup?' · المشرف: '+esc(H().sup):''}</span></div>
  <select class="hsel" data-f="halaqa" aria-label="الحلقة">${hs.map(h=>`<option value="${h.id}"${h.id===S.cur?' selected':''}>${esc(h.name||'حلقة')}</option>`).join('')}<option value="__new">＋ إضافة حلقة</option></select></div></div>`}
function monthSel(){return `<div class="card"><div class="mon"><label class="sub" for="msel" style="white-space:nowrap">الشهر</label><select id="msel" data-f="mon">${S.months.slice().sort().map(m=>`<option value="${m}"${m===S.mon?' selected':''}>${esc('⁦'+monTxt(m)+'⁩')}</option>`).join('')}</select><button class="btn sm gold" data-a="newmon">${ico('plus',16)} شهر جديد</button></div></div>`}
function fieldBlock(s,f,e){const [k,l]=f;if(k==='int'&&isBig(s.path))return '';const v=e[k]??'';
  return `<div class="fl"><label>${l}</label><div class="st"><button data-a="stp" data-s="${s.id}" data-k="${k}" data-d="-1" aria-label="إنقاص">−</button><input inputmode="decimal" data-in="${s.id}" data-k="${k}" value="${esc(v)}" placeholder="0" aria-label="${l}"><button data-a="stp" data-s="${s.id}" data-k="${k}" data-d="1" aria-label="زيادة">+</button></div></div>`}
function brief(e){const p=[];if(e.hifz)p.push('حفظ '+e.hifz);if(e.rev)p.push('مراجعة '+e.rev);if(e.exam)p.push('اختبار '+e.exam);return p.join(' · ')}
function card(s,i){const e=ent(S.mon,S.wk,s.id),big=isBig(s.path),op=ui.open===s.id;
  return `<div class="stu${hasData(e)?' done':''}${op?' open':''}" id="c-${s.id}"><button class="sh" data-a="open" data-s="${s.id}" aria-expanded="${op}"><div class="num">${i+1}</div><div class="nm">${esc(s.name)}<span class="chip">${esc(gKey(s))}</span><div class="sm2" id="b-${s.id}">${esc(brief(e))}</div></div><div class="tot"><small>النقاط</small><b id="t-${s.id}">${pts(e,big)}</b></div><span class="chev">${ico('chev',20)}</span></button>${op?`<div class="body"><div class="fg">${FLD.map(f=>fieldBlock(s,f,e)).join('')}</div></div>`:''}</div>`}
function viewMarks(){

/* ---------- قراءة ملف Excel دون مكتبات خارجية ---------- */
const unx=t=>String(t).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const attr=(tag,a)=>{const m=tag.match(new RegExp('\\s'+a+'="([^"]*)"'));return m?unx(m[1]):''};
async function readXlsx(file){
  const z=await JSZip.loadAsync(file),txt=async n=>z.file(n)?await z.file(n).async('string'):'';
  const ss=[];(await txt('xl/sharedStrings.xml')).replace(/<si>([\s\S]*?)<\/si>/g,(m,b)=>{ss.push([...b.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>unx(x[1])).join(''));return m});
  const wb=await txt('xl/workbook.xml'),rel=await txt('xl/_rels/workbook.xml.rels'),rm={};
  [...rel.matchAll(/<Relationship\b[^>]*>/g)].forEach(m=>{rm[attr(m[0],'Id')]=attr(m[0],'Target')});
  const out=[];
  for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){const name=attr(m[0],'name'),t=rm[attr(m[0],'r:id')];if(!t)continue;
    const path=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,''),x=await txt(path),rows={};
    for(const c of x.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const ref=attr(c[1],'r').match(/^([A-Z]+)(\d+)$/);if(!ref||c[2]==null)continue;const ty=attr(c[1],'t');let v=null;
      if(ty==='inlineStr'){v=[...c[2].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(q=>unx(q[1])).join('')}
      else{const vm=c[2].match(/<v>([\s\S]*?)<\/v>/);if(vm){v=ty==='s'?ss[+vm[1]]:ty==='str'||ty==='b'||ty==='e'?unx(vm[1]):Number(vm[1])}}
      if(v!==null&&v!==''){(rows[+ref[2]]||(rows[+ref[2]]={}))[ref[1]]=v}}
    out.push({name,rows})}
  return out;
}
const HDR={'اسم الطالب':'name','الاسم':'name','المسار':'path','الحفظ':'hifz','المراجعة':'rev','الدروس':'les','التفاعل':'int','الاختبار':'exam','المضمار':'track'};
function parseSheet(sh){
  const R=sh.rows,hdrs=[];Object.keys(R).map(Number).sort((a,b)=>a-b).forEach(r=>{const row=R[r];if(Object.values(row).some(v=>String(v).trim()==='اسم الطالب'||String(v).trim()==='الاسم')&&Object.values(row).some(v=>String(v).trim()==='الحفظ'))hdrs.push(r)});
  if(!hdrs.length)return null;
  const mapOf=r=>{const m={},seen={};Object.entries(R[r]).forEach(([c,v])=>{const k=HDR[String(v).trim()];if(k&&!m[k])m[k]=c});return m};
  const maps=hdrs.map(mapOf),m0=maps[0],students=[];
  for(let r=hdrs[0]+1;r<hdrs[0]+1+MAXS;r++){const nm=R[r]&&R[r][m0.name];if(nm==null||String(nm).trim()==='')break;
    const wks=[];for(let k=0;k<Math.min(5,hdrs.length);k++){const rr=hdrs[k]+(r-hdrs[0]),row=R[rr]||{},e={};
      FLD.forEach(([f])=>{const c=maps[k][f];if(c&&row[c]!==undefined&&row[c]!==''&&isFinite(Number(row[c])))e[f]=String(Number(row[c]))});wks.push(e)}
    students.push({name:String(nm).trim(),path:m0.path?String((R[r]||{})[m0.path]??'').trim():'',wks})}
  const g=c=>R[2]&&R[2][c]!==undefined?String(R[2][c]).trim():'';
  return{students,teacher:g('C'),halaqa:g('H'),sup:g('K')};
}
function applyPath(s,txt){const d=S.def;let p=d.p,l=d.l;txt=String(txt||'').trim();
  if(txt){const parts=txt.split(/[.\s]+/).filter(Boolean);const pc=parts[0];
    let po=S.paths.find(x=>x.code===pc)||S.paths.find(x=>nname(x.name)===nname(txt));
    if(!po&&pc){po={code:pc,name:pc};S.paths.push(po)}
    if(po){p=po.code;if(po.nolevel)l='';else{const lc=parts[1];const lo=S.levels.find(x=>x.code===lc)||S.levels.find(x=>nname(x.name)===nname(lc||''));l=lo?lo.code:S.levels[0].code}}}
  s.path=p;s.level=noLvl(p)?'':l}
async function importXlsx(f){
  if(!window.JSZip){toast('المكتبة غير محمّلة');return}
  let sheets;try{sheets=(await readXlsx(f)).map(s=>({s,p:parseSheet(s)})).filter(x=>x.p&&x.p.students.length)}catch(e){toast('تعذّرت قراءة الملف، تأكد أنه Excel (xlsx)');return}
  if(!sheets.length){toast('لم أجد طلاباً؛ تأكد أن الملف بنموذج الحلقة المفرغة');return}
  const items=sheets.map((x,i)=>{const nm=x.p.halaqa||x.s.name,ex=S.halaqat.find(h=>nname(h.name)===nname(nm))||(sheets.length===1&&!H().students.length?H():null);return{i,nm,ex,x}});
  const body=`<div class="sub">الشهر: ${esc('⁦'+monTxt(S.mon)+'⁩')} — تُضاف الأسماء غير الموجودة، وتُحدَّث علامات الموجودة.</div>`+items.map(it=>`<label class="row" style="padding:9px 0;border-bottom:1px dashed var(--line)"><input type="checkbox" data-it="${it.i}" checked style="width:auto"><span style="flex:1"><b>${esc(it.nm)}</b><br><span class="sub">${it.x.p.students.length} طالب · ${it.ex?'إلى الحلقة الموجودة «'+esc(it.ex.name)+'»':'حلقة جديدة'}</span></span></label>`).join('');
  const o=await box('استيراد من Excel',body,'<button class="btn pri" style="flex:1" data-x="go">استيراد</button><button class="btn" data-x="no">إلغاء</button>');
  o.onclick=e=>{const x=e.target.dataset.x;if(e.target===o||x==='no'){o.remove();return}if(x!=='go')return;
    const pick=[...o.querySelectorAll('[data-it]:checked')].map(c=>items[+c.dataset.it]);if(!pick.length){toast('حدّد حلقة واحدة');return}
    let add=0,upd=0,last=null;
    pick.forEach(it=>{let h=it.ex;if(!h){h=newH(it.nm,it.x.p.sup);S.halaqat.push(h)}else if(!h.sup&&it.x.p.sup)h.sup=it.x.p.sup;if(!S.teacher&&it.x.p.teacher)S.teacher=it.x.p.teacher;last=h;
      it.x.p.students.forEach(ps=>{let s=h.students.find(q=>nname(q.name)===nname(ps.name));
        if(!s){if(h.students.length>=MAXS)return;s={id:uid(),name:ps.name};applyPath(s,ps.path);h.students.push(s);add++}else{if(ps.path)applyPath(s,ps.path);upd++}
        ps.wks.forEach((e,k)=>{if(!Object.keys(e).length)return;const key=wkKey(S.mon,k+1),mm=h.entries[key]||(h.entries[key]={});mm[s.id]={...e}})})});
    if(last)S.cur=last.id;ui.tab='marks';ui.open='';save();o.remove();render();toast(`تم الاستيراد: ${add} طالب جديد، ${upd} موجود`)}}

/* ---------- تصدير Excel بنموذج الحلقة المفرغة (ورقة لكل حلقة) ---------- */
async function buildXlsx(mon,hs){
  hs=hs.filter(h=>h.students.length);if(!hs.length){toast('أضف الطلاب أولاً');return null}
  const bin=atob(TPL_B64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const z=await JSZip.loadAsync(u8),X=n=>z.file(n).async('string'),xe=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sheet0=await X('xl/worksheets/sheet1.xml'),tabs=[];for(let t=1;t<=6;t++)tabs.push(await X('xl/tables/table'+t+'.xml'));
  const oldN=tabs.map(t=>t.match(/ name="([^"]*)"/)[1]),HR=[7,46,85,124,163],used=new Set(),names=[];
  z.remove('xl/worksheets/sheet2.xml');z.remove('xl/calcChain.xml');for(let t=1;t<=6;t++)z.remove('xl/tables/table'+t+'.xml');
  hs.forEach((h,k)=>{
    let nm=(h.name||'حلقة').replace(/[\[\]:*?\/\\]/g,'-').slice(0,31)||'حلقة';const b0=nm;let c=2;while(used.has(nm.toLowerCase()))nm=b0.slice(0,28)+' '+c++;used.add(nm.toLowerCase());names.push(nm);
    const V={},CV={},st=h.students.slice(0,MAXS);
    V.E2=monTxt(mon);if(S.teacher)V.C2=S.teacher;V.H2=h.name;if(h.sup)V.K2=h.sup;
    st.forEach((s,i)=>{const g=gKey(s);V['C'+(8+i)]=s.name;if(g)V['D'+(8+i)]=g;
      for(let wi=0;wi<5;wi++){const r=HR[wi]+1+i;if(wi){CV['C'+r]=s.name;CV['D'+r]=g}const e=entH(h,mon,wi+1,s.id);
        [['E','hifz'],['G','rev'],['I','les'],['J','int'],['K','exam'],['L','track']].forEach(([col,f])=>{if(f==='int'&&isBig(s.path))return;const v=e[f];if(v!==''&&v!=null&&isFinite(Number(v)))V[col+r]=Number(v)})}});
    let x=sheet0.replace(/<customSheetViews>[\s\S]*?<\/customSheetViews>/,'').replace(/ xr:uid="[^"]*"/g,'');if(k)x=x.replace(' tabSelected="1"','');x=x.replace(/<c r="([EF]2)" s="1"\s*\/>/g,'<c r="$1" s="2"/>').replace(/<mergeCells count="(\d+)">/,(m,n)=>'<mergeCells count="'+(+n+1)+'"><mergeCell ref="E2:F2"/>');
    const nn=oldN.map(o=>k?o+'_'+(k+1):o);oldN.forEach((o,t)=>{if(k)x=x.split(o+'[').join(nn[t]+'[')});
    x=x.replace(/<c r="([A-Z]+\d+)"([^>]*?)\s*\/>/g,(m,ref,a)=>{if(!(ref in V))return m;const v=V[ref];return typeof v==='number'?`<c r="${ref}"${a}><v>${v}</v></c>`:`<c r="${ref}"${a} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`});
    x=x.replace(/<c r="([A-Z]+\d+)"([^>]*)>(<f[^>]*?(?:\/>|>[^<]*<\/f>))<v\s*\/><\/c>/g,(m,ref,at,f)=>(ref in CV&&CV[ref]!=='')?`<c r="${ref}"${at}>${f}<v>${xe(CV[ref])}</v></c>`:m);
    z.file('xl/worksheets/sheet'+(k+1)+'.xml',x);
    let rel='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    for(let t=1;t<=6;t++){const id=k*6+t;rel+=`<Relationship Id="rId${t}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table${id}.xml"/>`;
      z.file('xl/tables/table'+id+'.xml',tabs[t-1].replace(/ xr3?:uid="[^"]*"/g,'').replace(/ id="\d+"/,' id="'+id+'"').replace(/ name="[^"]*"/,' name="'+nn[t-1]+'"').replace(/ displayName="[^"]*"/,' displayName="'+nn[t-1]+'"'))}
    z.file('xl/worksheets/_rels/sheet'+(k+1)+'.xml.rels',rel+'</Relationships>')});
  let ct=await X('[Content_Types].xml');ct=ct.replace(/<Override PartName="\/xl\/(worksheets\/sheet\d+|tables\/table\d+|calcChain)\.xml"[^>]*\/>/g,'');
  let add='';hs.forEach((h,k)=>{add+=`<Override PartName="/xl/worksheets/sheet${k+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;for(let t=1;t<=6;t++)add+=`<Override PartName="/xl/tables/table${k*6+t}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/>`});
  z.file('[Content_Types].xml',ct.replace('</Types>',add+'</Types>'));
  let wb=await X('xl/workbook.xml');
  wb=wb.replace(/<sheets>[\s\S]*?<\/sheets>/,'<sheets>'+names.map((n,k)=>`<sheet name="${xe(n)}" sheetId="${k+1}" r:id="${k?'rId'+(10+k):'rId1'}"/>`).join('')+'</sheets>').replace(/<definedNames>[\s\S]*?<\/definedNames>/,'').replace(/<customWorkbookViews>[\s\S]*?<\/customWorkbookViews>/,'').replace(/<calcPr[^>]*\/>/,'<calcPr calcId="191028" fullCalcOnLoad="1"/>');z.file('xl/workbook.xml',wb);
  let rl=await X('xl/_rels/workbook.xml.rels');rl=rl.replace(/<Relationship Id="rId2"[^>]*\/>/,'').replace(/<Relationship Id="rId6"[^>]*\/>/,'');
  rl=rl.replace('</Relationships>',hs.slice(1).map((h,i)=>`<Relationship Id="rId${11+i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+2}.xml"/>`).join('')+'</Relationships>');z.file('xl/_rels/workbook.xml.rels',rl);
  z.file('docProps/app.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Microsoft Excel</Application></Properties>');
  const blob=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
  return{blob,name:`${hs.length>1?'الحلقات':hs[0].name||'حلقة'} ${monTxt(mon).replace(/ \/ /g,'-')} ${today()}.xlsx`.replace(/[\\/:*?"<>|]/g,'-')};
}

/* ---------- التحديث اليدوي والعمل دون إنترنت ---------- */
let swReg=null,swReload=false;
function applyUpd(w){swReload=true;toast('جارٍ التحديث…');w.postMessage('skip')}
async function checkUpd(){
  if(!('serviceWorker' in navigator)||!swReg){toast('التحديث غير متاح في هذا العرض');return}
  if(swReg.waiting){applyUpd(swReg.waiting);return}
  if(!navigator.onLine){toast('لا يوجد اتصال بالإنترنت');return}
  ui.busy=true;render();
  try{await swReg.update();if(swReg.installing)await new Promise(res=>{const w=swReg.installing;w.addEventListener('statechange',()=>{if(['installed','redundant','activated'].includes(w.state))res()});setTimeout(res,15000)})}
  catch(e){ui.busy=false;render();toast('تعذّر التحقق من التحديث');return}
  ui.busy=false;if(swReg.waiting){ui.upd=true;render();applyUpd(swReg.waiting)}else{render();toast('أنت على أحدث إصدار ✓')}
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;const chk=()=>{if(r.waiting&&navigator.serviceWorker.controller){ui.upd=true;render()}};chk();
    r.addEventListener('updatefound',()=>{const w=r.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')chk()})})}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReload)location.reload()});
}
if(!S.months.includes(S.mon))S.months.push(S.mon);
render();if(!S.setup)setup();
